web_extra_daemons:
  - name: messenger-consume
    command: "php /var/www/html/bin/console messenger:consume opendxp_core opendxp_maintenance opendxp_scheduled_tasks opendxp_search_backend_message --memory-limit=250M --time-limit=3600"
    directory: /var/www/html
  - name: consume-asset-update
    command: "php /var/www/html/bin/console messenger:consume opendxp_asset_update --memory-limit=250M --time-limit=3600"
    directory: /var/www/html
  - name: consume-image-optimize
    command: "php /var/www/html/bin/console messenger:consume opendxp_image_optimize --memory-limit=250M --time-limit=3600"
    directory: /var/www/html
