[group:opendxp-messenger-prd]
programs=opendxp-core,opendxp-asset-update,opendxp-image-optimize

[program:opendxp-core]
command=php /var/www/webroot/opendxp/current/bin/console messenger:consume opendxp_core opendxp_maintenance opendxp_scheduled_tasks opendxp_search_backend_message --memory-limit=256M --time-limit=3600
user=nginx
numprocs=1
startsecs=0
autostart=true
autorestart=true
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/www/webroot/supervisor/supervisord.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=4
redirect_stderr=true

[program:opendxp-asset-update]
command=php /var/www/webroot/opendxp/current/bin/console messenger:consume opendxp_asset_update --memory-limit=256M --time-limit=3600
user=nginx
numprocs=1
startsecs=0
autostart=true
autorestart=true
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/www/webroot/supervisor/supervisord.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=4
redirect_stderr=true

[program:opendxp-image-optimize]
command=php /var/www/webroot/opendxp/current/bin/console messenger:consume opendxp_image_optimize --memory-limit=256M --time-limit=3600
user=nginx
numprocs=1
startsecs=0
autostart=true
autorestart=true
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/www/webroot/supervisor/supervisord.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=4
redirect_stderr=true
