name: Deploy to Staging

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: stg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm build

      - name: Install Deployer
        run: composer install --working-dir=.deploy --prefer-dist --no-progress --no-interaction

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.TRENDHOSTING_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy
        env:
          CI_ENVIRONMENT_NAME: stg
          # ── SSH / Server ──────────────────────────────────────────────────────
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          HTTP_USER: ${{ vars.HTTP_USER }}
          PHP_BIN: ${{ vars.PHP_BIN }}
          # ── Database ──────────────────────────────────────────────────────────
          DATABASE_HOST: ${{ vars.DATABASE_HOST }}
          DATABASE_PORT: ${{ vars.DATABASE_PORT }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          # ── Application (.env.local values) ───────────────────────────────────
          APP_ENV: ${{ vars.APP_ENV }}
          APP_DEBUG: ${{ vars.APP_DEBUG }}
          OPENDXP_DEV_MODE: ${{ vars.OPENDXP_DEV_MODE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          MAILER_DSN_MAIN: ${{ secrets.MAILER_DSN_MAIN }}
          MAILER_DSN_NEWSLETTER: ${{ secrets.MAILER_DSN_NEWSLETTER }}
          TRUSTED_PROXIES: ${{ vars.TRUSTED_PROXIES }}
          TRUSTED_HOSTS: ${{ vars.TRUSTED_HOSTS }}
          # ── Full .env.local template ──────────────────────────────────────────
          ENV_LOCAL_TEMPLATE: ${{ vars.ENV_LOCAL_TEMPLATE }}
        run: .deploy/vendor/bin/dep deploy -f .deploy/deploy.php
